# Builds the Windows installer on GitHub's runner and publishes it to a GitHub Release.
# Trigger: push a tag matching the package.json version, e.g.
#   git tag v1.1.0 && git push origin v1.1.0
# electron-builder uploads Orange-Setup-<version>.exe, its .blockmap and latest.yml,
# which is what the in-app auto-updater reads.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Use the official download hosts on GitHub's network (scripts/dist.mjs defaults to a mirror).
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package.json version $v" }

      - name: Install dependencies
        run: npm ci

      - name: Cache bundled tools
        uses: actions/cache@v4
        with:
          path: vendor/bin
          key: vendor-${{ hashFiles('scripts/vendor/*.mjs') }}

      - name: Download bundled tools (FFmpeg, 7-Zip, ImageMagick, Pandoc, Ghostscript)
        run: npm run vendor

      # Every conversion and tool against generated files; a failure stops the release.
      - name: Regression tests
        run: npm test
        env:
          ORANGE_TEST_REPORT_DIR: ${{ runner.temp }}/orange-test-results

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orange-test-report
          path: ${{ runner.temp }}/orange-test-results/
          if-no-files-found: ignore

      # Create the release up front. electron-builder uploads files in parallel and, if no
      # release exists yet, each upload can create its own copy of the release.
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag.TrimStart('v') --generate-notes }
          exit 0

      - name: Build and publish installer
        run: node scripts/dist.mjs --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing: add these as repository secrets to sign the installer.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orange-Setup
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
