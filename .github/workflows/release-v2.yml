# Orange 2.x (Tauri): builds the NSIS installer on GitHub's runner and publishes it to a GitHub
# Release with everything both updaters read:
#   Orange_<v>_x64-setup.exe        the installer
#   Orange_<v>_x64-setup.exe.sig    its minisign signature (tauri-plugin-updater verifies it)
#   latest.json                     the 2.x updater manifest (endpoint: releases/latest/download/latest.json)
#   latest.yml                      the 1.x electron-updater manifest, so 1.x installs move to 2.x
# It also copies the installer and a latest.json pointing at that copy to the gh-pages branch
# (https://<owner>.github.io/orange/update/), the updater's first endpoint: some networks reset
# connections to release-assets.githubusercontent.com, where GitHub serves release files.
# Trigger: bump "version" in src-tauri/tauri.conf.json, src-tauri/Cargo.toml and package.json, then
#   git tag v2.0.0 && git push origin v2.0.0
# Secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (see docs/MIGRATION.md).
name: Release v2

on:
  push:
    tags: ['v2.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check the tag matches tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match tauri.conf.json version $v" }

      - name: Install dependencies
        run: npm ci

      - name: Build the web pages
        run: npm run build:web

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # The tests fetch FFmpeg, 7-Zip, Ghostscript, Pandoc and ImageMagick with the app's own
      # downloader (~110 MB). Cached by the pinned URLs and hashes in engines.rs.
      - name: Cache downloaded engines
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/orange-engines
          key: engines-${{ hashFiles('src-tauri/src/engines.rs') }}

      # The feature cfgs un-ignore the converter, settings, updater and tool cases. The tool cases
      # drive off-screen WebView2 windows, which the hosted runner's desktop session provides.
      # The wheel self-test (--selftest) is left out of CI.
      # Everything that needs no desktop session: a failure here stops the release.
      - name: Tests (converters, settings, wheel logic)
        id: tests_core
        timeout-minutes: 40
        working-directory: src-tauri
        run: cargo test --no-fail-fast --lib --test conversion_matrix --test convert_image --test drag_flows --test regressions --test settings_updater
        env:
          RUSTFLAGS: --cfg orange_converters --cfg orange_settings --cfg orange_updater --cfg orange_tools
          ORANGE_ENGINES_DIR: ${{ runner.temp }}/orange-engines

      # These open hidden WebView2 tool windows and use the real clipboard. They failed once (beta.2)
      # on code that passed before and after, so a failure gets one retry; failing twice stops the release.
      - name: Tests (tool windows and clipboard)
        id: tests_windows
        timeout-minutes: 30
        working-directory: src-tauri
        run: |
          cargo test --no-fail-fast --test tools --test clipboard
          if ($LASTEXITCODE -ne 0) {
            "::warning title=Tests windows+clipboard::failed once, retrying"
            cargo test --no-fail-fast --test tools --test clipboard
          }
          exit $LASTEXITCODE
        env:
          RUSTFLAGS: --cfg orange_converters --cfg orange_settings --cfg orange_updater --cfg orange_tools
          ORANGE_ENGINES_DIR: ${{ runner.temp }}/orange-engines

      # Leaves each outcome as a public annotation (readable without logging in) on the run page and API.
      - name: Report test outcomes
        if: always()
        run: |
          "::notice title=Tests core::outcome=${{ steps.tests_core.outcome }}"
          "::notice title=Tests windows+clipboard::outcome=${{ steps.tests_windows.outcome }}"

      # Cases that could not get an engine (offline) skip with a reason instead of failing.
      - name: Show skipped test cases
        if: always()
        run: |
          $f = Join-Path $env:TEMP 'orange2-tests/skips.txt'
          if (Test-Path $f) { Get-Content $f } else { 'No skipped cases.' }

      # Authenticode (stops the SmartScreen "unknown publisher" warning) only once the repo has the
      # secrets WINDOWS_CERTIFICATE (the .pfx, base64) and WINDOWS_CERTIFICATE_PASSWORD. Without them the
      # installer is still built, just unsigned. The updater signature below is separate and always on.
      - name: Build the signed installer
        working-directory: src-tauri
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            $env:ORANGE_CERT_PATH = Join-Path $env:RUNNER_TEMP 'orange-cert.pfx'
            [IO.File]::WriteAllBytes($env:ORANGE_CERT_PATH, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $script = (Resolve-Path ../scripts/sign-windows.ps1).Path
            $env:TAURI_CONFIG = (@{ bundle = @{ windows = @{ signCommand = "pwsh -NoProfile -File `"$script`" %1" } } } | ConvertTo-Json -Depth 5 -Compress)
            "::notice title=Code signing::on"
          } else {
            "::notice title=Code signing::off (no WINDOWS_CERTIFICATE secret)"
          }
          cargo tauri build --bundles nsis
          $code = $LASTEXITCODE
          if ($env:ORANGE_CERT_PATH) { Remove-Item $env:ORANGE_CERT_PATH -Force -ErrorAction SilentlyContinue }
          exit $code
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          ORANGE_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Write latest.json and latest.yml
        id: manifests
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $dir = 'src-tauri/target/release/bundle/nsis'
          $exe = Get-Item "$dir/*_${v}_x64-setup.exe"
          $sig = Get-Item "$($exe.FullName).sig"
          $tag = "v$v"
          # GitHub turns spaces into dots in asset names; Tauri's names have none.
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exe.Name)"
          $now = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')

          # tauri-plugin-updater manifest.
          $notes = "Orange $v. See https://github.com/${{ github.repository }}/releases/tag/$tag"
          @{
            version  = $v
            notes    = $notes
            pub_date = $now
            platforms = @{ 'windows-x86_64' = @{ signature = (Get-Content $sig -Raw).Trim(); url = $url } }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM "$dir/latest.json"

          # electron-updater manifest for Orange 1.x (sha512 is base64, as electron-builder writes it).
          $sha = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash([IO.File]::ReadAllBytes($exe.FullName)))
          @"
          version: $v
          files:
            - url: $($exe.Name)
              sha512: $sha
              size: $($exe.Length)
          path: $($exe.Name)
          sha512: $sha
          releaseDate: '$now'
          "@ | Set-Content -Encoding utf8NoBOM "$dir/latest.yml"

          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "sig=$($sig.FullName)" >> $env:GITHUB_OUTPUT
          "dir=$dir" >> $env:GITHUB_OUTPUT
          Get-Content "$dir/latest.json", "$dir/latest.yml"

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $dir = '${{ steps.manifests.outputs.dir }}'
          $files = @('${{ steps.manifests.outputs.exe }}', '${{ steps.manifests.outputs.sig }}', "$dir/latest.json", "$dir/latest.yml")
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            # --latest: both updaters read the "latest" release, so 2.x must hold that badge.
            gh release create $tag --title $tag.TrimStart('v') --generate-notes --latest @files
          } else {
            gh release upload $tag --clobber @files
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }

      # One orphan commit holding only the newest installer, so the branch never grows.
      - name: Mirror the update to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-Item '${{ steps.manifests.outputs.exe }}'
          $owner = '${{ github.repository_owner }}'.ToLower()
          $base = "https://$owner.github.io/${{ github.event.repository.name }}/update"
          $site = Join-Path $env:RUNNER_TEMP 'pages'
          New-Item -ItemType Directory -Force "$site/update" | Out-Null
          Copy-Item $exe.FullName "$site/update/"
          $m = Get-Content '${{ steps.manifests.outputs.dir }}/latest.json' -Raw | ConvertFrom-Json
          $m.platforms.'windows-x86_64'.url = "$base/$($exe.Name)"
          $m | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM "$site/update/latest.json"
          New-Item "$site/.nojekyll" -ItemType File | Out-Null
          Push-Location $site
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Update mirror for ${{ github.ref_name }}"
          git push -f "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git" gh-pages
          if ($LASTEXITCODE -ne 0) { throw "push to gh-pages failed" }
          Pop-Location
          # Make sure Pages serves the branch (fails harmlessly if it already does or the token may not).
          gh api -X POST "repos/${{ github.repository }}/pages" -f 'source[branch]=gh-pages' -f 'source[path]=/' 2>$null
          $global:LASTEXITCODE = 0

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orange-Setup-v2
          path: |
            ${{ steps.manifests.outputs.dir }}/*.exe
            ${{ steps.manifests.outputs.dir }}/*.sig
            ${{ steps.manifests.outputs.dir }}/latest.*
          if-no-files-found: error
