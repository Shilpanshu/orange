[package]
name = "orange"
version = "2.0.0-alpha.1"
description = "Drag a file, tap a key, convert it. A radial file converter for Windows."
authors = ["Shilpanshu"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "orange_lib"
crate-type = ["rlib"]

[[bin]]
name = "orange"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.39"
# Only the codecs phase 1 needs. Each extra codec adds to the binary.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[features]
# In-process end-to-end test of the drop path (drives the wheel's real IDropTarget). Never in release.
selftest = []

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[profile.dev]
# Keep dev builds reasonably quick but not glacial at runtime.
opt-level = 1
